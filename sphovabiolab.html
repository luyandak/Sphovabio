<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sphova's Bio Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: one phone-shaped column. Vertical swipe feed on top of a pink tab bar, everything else is a panel that slides over the feed. */
:root{
  --bg:#FFEFF6; --bg2:#FFD9EA; --card:#FFFFFF; --ink:#3A0B26; --ink2:#7A4560; --line:#F5C2DA;
  --pink:#E3157E; --pink2:#FF5CA8; --pinkSoft:#FFC2DE; --gold:#FFC93C; --good:#0E8F4F; --goodSoft:#CFF2DE; --bad:#D6341F; --badSoft:#FFD8D1;
  --t1:#FF2E93; --t2:#F43F5E; --t3:#D946EF; --t4:#FF6B81; --t5:#C026D3; --t6:#E11D74; --t7:#FF77B7; --t8:#F472B6; --t9:#BE185D; --t10:#FB7185;
  --shadow:0 10px 30px -12px rgba(120,10,70,.35);
  --display:"Bagel Fat One","Trebuchet MS",system-ui,sans-serif; --body:"Outfit",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D0615; --bg2:#2F0A23; --card:#3B1031; --ink:#FFE8F3; --ink2:#E5AFCB; --line:#62204A;
  --pink:#FF4FA6; --pink2:#FF7DBE; --pinkSoft:#6E1B4D; --gold:#FFD25A; --good:#4BD58A; --goodSoft:#14472F; --bad:#FF7A66; --badSoft:#552018;
  --t1:#FF5CA8; --t2:#FF6B86; --t3:#E879F9; --t4:#FF8A9B; --t5:#D96BEA; --t6:#FF5C9E; --t7:#FF9CCB; --t8:#F8A0CD; --t9:#F0609C; --t10:#FF93A3;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D0615; --bg2:#2F0A23; --card:#3B1031; --ink:#FFE8F3; --ink2:#E5AFCB; --line:#62204A;
  --pink:#FF4FA6; --pink2:#FF7DBE; --pinkSoft:#6E1B4D; --gold:#FFD25A; --good:#4BD58A; --goodSoft:#14472F; --bad:#FF7A66; --badSoft:#552018;
  --t1:#FF5CA8; --t2:#FF6B86; --t3:#E879F9; --t4:#FF8A9B; --t5:#D96BEA; --t6:#FF5C9E; --t7:#FF9CCB; --t8:#F8A0CD; --t9:#F0609C; --t10:#FF93A3;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none}
.logo{font-family:var(--display);font-size:22px;color:var(--pink);letter-spacing:.2px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
#view{flex:1;min-height:0;position:relative}
.tabs{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:600;color:var(--ink2)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:#fff;background:var(--pink)}
.panel{position:absolute;inset:0;overflow-y:auto;padding:8px 16px 28px;overscroll-behavior:contain}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px}
.sub{color:var(--ink2);margin:4px 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--pink);color:#fff;font-weight:700;border-radius:16px;padding:12px 18px;box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pink) 60%,#000)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--tc,var(--pink)) 22%,var(--card));color:var(--ink);border:2px solid var(--tc,var(--pink))}

/* FEED */
.feedwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.topicbar{flex:none;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.topicbar::-webkit-scrollbar{display:none}
.tchip{flex:none;border:2px solid var(--tc,var(--pink));background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--tc,var(--pink));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.prog{flex:none;display:flex;gap:3px;padding:0 16px 8px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--pink)}
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:var(--slideh,70vh);scroll-snap-align:start;scroll-snap-stop:always;position:relative;padding:6px 16px 10px;display:flex}
.slidein{flex:1;min-width:0;border-radius:28px;padding:20px 66px 20px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative;
  background:radial-gradient(120% 70% at 100% 0%,color-mix(in srgb,var(--tc) 38%,var(--card)) 0%,transparent 60%),linear-gradient(180deg,color-mix(in srgb,var(--tc) 16%,var(--card)),var(--card));
  border:2px solid color-mix(in srgb,var(--tc) 55%,var(--line))}
.slidein .blob{position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:color-mix(in srgb,var(--tc) 22%,transparent);pointer-events:none}
.hook{font-family:var(--display);font-size:clamp(26px,7.2vw,36px);line-height:1.05;text-wrap:balance}
.txt{font-size:clamp(16px,4.3vw,19px);line-height:1.5;overflow-y:auto;min-height:0}
.txt b{background:color-mix(in srgb,var(--gold) 55%,transparent);border-radius:5px;padding:0 3px;font-weight:700}
.tip{margin-top:auto;border:2px dashed var(--tc);border-radius:16px;padding:9px 12px;font-weight:600;font-size:15px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.tip small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.viz{width:100%;max-height:150px}
.rail{position:absolute;right:22px;bottom:22px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:2}
.rb{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.rb svg{width:22px;height:22px}
.rb[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.rl{font-size:10px;font-weight:700;margin-top:-8px;color:var(--ink2)}
.nextfab{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.swipehint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);animation:bob 1.4s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-6px)}}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:600;font-size:16px}
.opt:hover{border-color:var(--pink)}
.opt.right{background:var(--goodSoft);border-color:var(--good)}
.opt.wrong{background:var(--badSoft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;padding:10px 12px;border-radius:14px;font-weight:600;font-size:15px}
.fb.ok{background:var(--goodSoft)}.fb.no{background:var(--badSoft)}
.checkhead{display:flex;align-items:center;gap:8px}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--pink);color:#fff;border-radius:8px;padding:3px 8px}
.conf{display:grid;gap:10px;margin-top:6px}
.conf button{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font-weight:700;text-align:left}
.conf i{width:18px;height:18px;border-radius:50%;flex:none}
.conf button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}

/* SONGS */
.songlist{display:grid;gap:12px}
.song{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border:2px solid var(--line);border-radius:20px;background:var(--card)}
.disc{flex:none;width:58px;height:58px;border-radius:50%;background:conic-gradient(from 20deg,var(--tc),var(--card),var(--tc),var(--card),var(--tc));border:3px solid var(--ink);position:relative}
.disc::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.playing .disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding:8px 16px 18px;gap:10px}
.lyrics{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
.ly{font-family:var(--display);font-size:clamp(22px,6vw,30px);line-height:1.1;opacity:.35;transition:opacity .2s,transform .2s;transform-origin:left}
.ly.now{opacity:1;color:var(--pink);transform:scale(1.04)}
.ly.hide span{filter:blur(8px)}
.eq{display:flex;gap:4px;height:24px;align-items:flex-end}
.eq i{width:5px;background:var(--pink);border-radius:2px;height:20%}
.on .eq i{animation:eqb .6s ease-in-out infinite alternate}
.eq i:nth-child(2n){animation-delay:.15s}.eq i:nth-child(3n){animation-delay:.3s}
@keyframes eqb{to{height:100%}}

/* GAMES */
.gamecard{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.gamecard b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.1}
.gamecard span{font-size:14px;color:var(--ink2)}
.gamecard svg{width:30px;height:30px;color:var(--pink)}
.back{border:0;background:none;font-weight:700;color:var(--pink);padding:6px 0;display:inline-flex;gap:4px;align-items:center}
.stage{margin-top:10px;display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pink);transition:width .3s}
.big{font-family:var(--display);font-size:34px;line-height:1.1}
.mono{font-family:var(--mono)}
.seq{display:flex;gap:6px;flex-wrap:wrap}
.base{width:46px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:22px;border:2px solid var(--ink);background:var(--card)}
.base.A{background:#FFC2DE;color:#3A0B26}.base.T,.base.U{background:#FFE08A;color:#3A0B26}.base.C{background:#D9C2FF;color:#3A0B26}.base.G{background:#BDEFD5;color:#3A0B26}
.base.empty{border-style:dashed;background:transparent;color:var(--ink2)}
.keypad{display:flex;gap:8px;flex-wrap:wrap}
.keypad .btn{min-width:56px}
.swipe{position:relative;height:260px;touch-action:pan-y}
.sc{position:absolute;inset:0;border-radius:26px;border:2px solid var(--pink);background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 18%,var(--card)),var(--card));padding:22px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:24px;line-height:1.15;box-shadow:var(--shadow);cursor:grab;user-select:none}
.sc.next{transform:scale(.95) translateY(10px);opacity:.7;pointer-events:none}
.stamp{position:absolute;top:14px;font-family:var(--display);font-size:20px;border:3px solid;border-radius:10px;padding:2px 8px;opacity:0}
.stamp.l{left:14px;color:var(--bad);transform:rotate(-12deg)}.stamp.r{right:14px;color:var(--good);transform:rotate(12deg)}
.chipbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:600;text-align:left}
.chipbtn.sel{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 14%,var(--card))}
.chipbtn.ok{border-color:var(--good);background:var(--goodSoft)}.chipbtn.bad{border-color:var(--bad);background:var(--badSoft)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{min-height:76px;border-radius:14px;border:2px solid var(--pink);background:var(--pink);color:transparent;font-weight:700;font-size:14px;padding:6px;display:grid;place-items:center;text-align:center;line-height:1.15}
.mc.up{background:var(--card);color:var(--ink)}
.mc.done{background:var(--goodSoft);color:var(--ink);border-color:var(--good)}
.punn{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;max-width:320px}
.punn .h{display:grid;place-items:center;font-family:var(--mono);font-weight:500}
.punn .cell{min-height:60px;border-radius:12px;border:2px dashed var(--ink2);background:var(--card);font-family:var(--mono);font-size:18px;font-weight:500}
.punn .cell.ok{border:2px solid var(--good);background:var(--goodSoft)}.punn .cell.bad{border:2px solid var(--bad);background:var(--badSoft)}
.bark{position:relative;height:250px;border-radius:20px;overflow:hidden;border:2px solid var(--ink);touch-action:manipulation}
.moth{position:absolute;width:26px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:0;padding:0;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.moth.dk{background:#241319}.moth.lt{background:#F4E8DE}
.pond{width:100%;height:auto;border-radius:20px;background:color-mix(in srgb,var(--pink2) 25%,var(--card));border:2px solid var(--line)}
.field{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px;font:inherit}

/* QUIZ / TEACH / ME */
.qtop{display:flex;align-items:center;gap:10px}
.scoreRing{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) var(--p,0%),var(--line) 0);position:relative;margin:6px auto}
.scoreRing::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}
.scoreRing b{position:relative;z-index:1;font-family:var(--display);font-weight:400;font-size:28px}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.step{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.step b{font-family:var(--display);font-weight:400;font-size:18px}
.step span{font-size:13px;color:var(--ink2)}
.step[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 2px var(--pinkSoft)}
.step .done{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:none;place-items:center}
.step.isdone .done{display:grid}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:4px 0}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;font-size:16px;white-space:pre-wrap}
.msg.c{background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.u{background:var(--pink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.pt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);width:100%;text-align:left;margin:6px 0}
.pt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--pink);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.pt.hit{border-color:var(--good);background:var(--goodSoft)}
.pt.hit .dot{background:var(--good);border-color:var(--good);color:#fff}
.pt.miss{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,var(--card))}
.timer{font-family:var(--mono);font-size:44px;font-weight:500;font-variant-numeric:tabular-nums}
.mast{display:flex;align-items:center;gap:10px;margin:4px 0}
.mast .lab{width:112px;font-weight:600;font-size:14px;flex:none}
.mast .bar{flex:1}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);font-weight:700;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:40}
.note{font-size:14px;color:var(--ink2)}
.hr{height:2px;background:var(--line);border:0;margin:14px 0}
@media (min-width:900px){
  body{background:linear-gradient(135deg,var(--bg2),var(--bg))}
  #app{max-width:1180px;display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "nav view"}
  .top{grid-area:top;padding:14px 24px 8px}.logo{font-size:28px}
  #view{grid-area:view;min-height:0}
  .tabs{grid-area:nav;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:6px;padding:12px;border-top:0;border-right:2px solid var(--line)}
  .tab{flex-direction:row;gap:12px;font-size:16px;padding:12px 14px;justify-content:flex-start}
  .panel{padding:12px 32px 40px}
  .panel{display:flex;flex-direction:column;align-items:center}
  .panel>*{width:100%;max-width:780px;flex:none}
  .panel .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .feedwrap{max-width:520px;margin:0 auto;left:0;right:0}
  .player{padding:12px calc((100% - 720px)/2) 24px}
  .toast{top:70px}
  h2{font-size:32px}
}
@media (min-width:900px) and (max-height:700px){.slidein{padding-top:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app" aria-live="off"></div>
<script>
/* ===== CONTENT: scope follows IEB Grade 12 SAG + Mind the Gap + IEB papers ===== */
// Q format: [question, correct, [wrong,wrong,wrong], why]
const TOPICS = [
{id:"dna",name:"DNA & Protein Synthesis",short:"DNA & RNA",c:"--t1",
reels:[
["DNA is the instruction manual for you","DNA sits on **chromosomes** in the nucleus. A **gene** is a section of DNA that codes for a protein. Proteins build your body and run your cells.","Gene → protein → trait.","flow"],
["Who cracked the code?","Many scientists helped. Franklin and Wilkins made X-ray images, Chargaff found that A = T and C = G, and **Watson and Crick** built the double helix model in **1953**. In the 1960s others worked out how DNA copies itself and how proteins are made.","Competition and teamwork both drive science."],
["A nucleotide has 3 parts","One **phosphate**, one **sugar** (deoxyribose) and one **nitrogenous base**. Join many nucleotides and you get a DNA strand. Two strands twist into a **double helix**.","P - S - B: Phosphate, Sugar, Base."],
["The 4 bases and their partners","**Adenine** pairs with **Thymine**. **Cytosine** pairs with **Guanine**. Hydrogen bonds hold the two strands together.","A-T and C-G: Apple Tree, Car Garage.","pairs"],
["DNA vs RNA","RNA is **single stranded**, has ribose sugar and uses **Uracil (U)** instead of Thymine. Know two types: **mRNA** (carries the message) and **tRNA** (brings amino acids).","RNA says U, never T."],
["Mitochondrial DNA is mum-only","Mitochondria have their own small DNA. It is passed on **only from the mother** and stays unaltered from mother to child, so it is used to work out how closely people are related.","Mito = Mum."],
["Transcription: DNA to mRNA","Happens in the **nucleus**. The enzyme **RNA polymerase** unzips the DNA and builds a matching **mRNA** strand (A pairs with U). The mRNA leaves through a nuclear pore.","Transcribe = copy in the same language (nucleic acid)."],
["Translation: mRNA to protein","Happens at the **ribosome** in the cytoplasm. Every 3 bases on mRNA is a **codon**. A **tRNA** with the matching **anticodon** brings the right amino acid. Amino acids join to make a protein.","Translate = change language: bases to amino acids."],
["Mutations are typos","**Substitution**: one base swapped (point mutation). **Insertion** or **deletion**: a base is added or lost, which shifts the reading frame (**frameshift**) so every codon after it changes. Causes: mutagens (radiation, chemicals) or chance.","Frameshift = everything after it is wrong."],
["DNA fingerprints","**Highly variable, non-coding DNA** differs from person to person. **PCR** makes many copies of a tiny sample so it can be tested. Used for crime scenes, relatedness tests, identifying remains and tracing illegal timber.","Non-coding = the part that varies most."]
],

{id:"meiosis",name:"Meiosis & Chromosomes",short:"Meiosis",c:"--t2",
reels:[
["Chromosomes: DNA, wrapped up","A **chromosome** is a tightly coiled DNA molecule in the nucleus. Before division, each chromosome copies itself into **two chromatids** joined at the **centromere**.","Chromatid = one copy. Joined copies = one chromosome."],
["Haploid vs diploid","**Diploid (2n)** = two sets of chromosomes, one from each parent (human body cell: 46). **Haploid (n)** = one set (human gamete: 23). Fertilisation joins two haploid gametes and restores diploid.","n = half. 2n = full set."],
["Where, when and why?","Meiosis happens in the **gonads** (testes and ovaries) in animals, and in the **anthers and ovules** of flowering plants. It makes gametes with half the chromosomes so the number stays constant after fertilisation, and it creates variation.","Meiosis = making gametes."],
["Step zero: DNA replication","In **interphase** the DNA unzips and each strand is used as a template to build a new partner strand. Result: two identical DNA molecules, so each chromosome now has two chromatids.","Copy first, divide later."],
["Meiosis I: the shuffle","**Prophase I**: homologous chromosomes pair up and **crossing over** swaps pieces. **Metaphase I**: pairs line up at the equator. **Anaphase I**: the pairs are pulled apart. **Telophase I**: two haploid cells.","Meiosis I separates the PAIRS."],
["Meiosis II: like mitosis","**Prophase II, Metaphase II, Anaphase II** (chromatids separate), **Telophase II**. End result: **four haploid cells**, all genetically different.","Meiosis II separates the CHROMATIDS."],
["Why are gametes all different?","**Crossing over** in prophase I and **random arrangement** of pairs in metaphase I shuffle the alleles. Random fertilisation adds even more variation.","Cross + Random = Variation."],
["When meiosis goes wrong","**Non-disjunction**: chromosomes fail to separate, so a gamete has an extra or missing chromosome. **Down syndrome** is trisomy 21 (47 chromosomes). A **karyotype** is a picture of all the chromosomes in pairs, used to spot this.","Tri-somy = three copies."],
["Mitosis vs meiosis","**Mitosis**: 1 division, 2 identical diploid cells, for growth and repair. **Meiosis**: 2 divisions, 4 different haploid cells, for gametes. Both start with DNA replication and both use the phases Prophase, Metaphase, Anaphase, Telophase.","Mitosis = Make copies. Meiosis = Make gametes."]
],

],

{id:"genetics",name:"Genetics & Inheritance",short:"Genetics",c:"--t3",
reels:[
["Mendel and his peas","Mendel crossed pea plants and counted large numbers of offspring (a **big sample** gives more reliable results). He deduced that traits are controlled by **factors in pairs**, now called genes. His work was first ignored, then later shaped genetics.","Bigger sample = more accurate ratios."],
["Words you must know","**Gene**: unit of inheritance at a **locus** on a chromosome. **Allele**: a version of a gene. **Genotype**: the alleles you have. **Phenotype**: what you look like. **Homozygous**: two same alleles. **Heterozygous**: two different alleles (a hybrid). **Dominant** shows when present; **recessive** only shows when homozygous.","Geno = Genes. Pheno = Physical."],
["P, F1 and F2","**P** = parent generation. **F1** = first filial generation (their offspring). **F2** = offspring of the F1. Each gamete carries **one allele** of each gene.","Filial = offspring."],
["Monohybrid cross recipe","1) Write the key (T = tall, t = short). 2) Parent genotypes. 3) Gametes. 4) Punnett square. 5) State genotype ratio and phenotype ratio. **Tt × Tt** gives 1 TT : 2 Tt : 1 tt and **3 tall : 1 short**.","Expected ratio is a prediction; real results only come close with large samples.","punnett"],
["Who decides the sex?","Humans have 22 pairs of **autosomes** and 1 pair of **gonosomes** (sex chromosomes). **XX = female, XY = male**. The father's sperm decides: 50% chance of a boy or a girl.","Dad's sperm carries X or Y."],
["Sex-linked traits","Genes for **haemophilia** and **red-green colour blindness** sit on the **X chromosome**. The Y has no matching allele, so a male with one recessive allele shows the trait. Females need two. A carrier female is X^H X^h.","Males have only one X, so no back-up allele."],
["Reading pedigrees","Squares = males, circles = females, shaded = has the trait. Two unaffected parents with an affected child means the trait is **recessive** and both parents are **carriers**.","Skip a generation? Think recessive."],
["Continuous traits","Continuous characteristics (like height) show a full range of values rather than a few clear groups. They tend to be **polygenic**, so many genes work together.","Continuous = a smooth range."],
["Mutations and variation","A **gene mutation** makes a new allele. It can be **harmful, beneficial or neutral**. Mutagens (UV, X-rays, chemicals) or copying errors cause them. Mutations are the raw material for variation.","Mutation = new allele."],
["Human Genome Project","The **HGP** mapped and sequenced all the human genes (completed in 2003). It helps to find genes for disorders and develop treatments, and it raises ethical questions about privacy and discrimination.","Big science, big ethics."]
],

{id:"engineering",name:"Genetic Engineering",short:"Gene Tech",c:"--t4",
reels:[
["Genetic engineering 101","Changing an organism's DNA by **adding, modifying or deleting** genes. **Recombinant DNA** = DNA from two sources joined. **Transgenic** = an organism carrying a gene from another species. **GMO** = genetically modified organism. **Biotechnology** = using living things to make products.","Recombine = mix. Transgenic = trans-species."],
["Molecular scissors and glue","**Restriction enzymes** cut DNA at specific sequences. **Ligase** joins DNA pieces together. Together they cut a gene out and paste it into a new piece of DNA.","Restriction = cut. Ligase = stick."],
["Bacteria that make insulin","The human **insulin gene** is cut out, then pasted into a bacterial **plasmid** (a vector) and put back in bacteria. The bacteria divide quickly and make human insulin in bulk for people with diabetes.","Plasmid = delivery vehicle."],
["Gene therapy","Fixing the **cause** of a genetic disorder by putting a healthy gene into a patient's cells. A **bacterial or viral vector** carries the gene in.","Treats the cause, not just the symptoms."],
["GMO crops and polyploids","Crops can get genes for pest resistance, drought tolerance or extra nutrients. **Plant tissue culture** grows many identical plants from tiny pieces. **Polyploid** plants have extra sets of chromosomes and are often bigger.","Poly = many sets."],
["Cloning an animal: SCNT","**Somatic cell nuclear transfer**: take the nucleus from a **donor's** body cell, put it into an egg whose nucleus was removed, let it divide into an **embryo**, then place it in a **surrogate** mother. The clone is genetically identical to the donor.","Dolly the sheep was the first mammal cloned this way."],
["Artificial selection and hybrid vigour","In **artificial selection** humans choose which organisms breed (dairy cows, maize, dogs). It mimics natural selection. **Hybrid vigour**: cross-bred offspring are often healthier and more resilient than inbred ones.","Humans choose = artificial."],
["CRISPR: editing genes","A tool that can **cut and change DNA at exact spots**. Hopes: repair mutated genes, stop malaria-carrying mosquitoes breeding. Concerns: ethics of editing human genes, who can afford it, long-term effects.","Edit, don't just cut and paste."],
["Debate time","Things to weigh up: GMO **labelling**, **monocultures**, multinational companies controlling seeds, biosecurity, and **indigenous knowledge** (people have bred crops for thousands of years). Always ask if a source is credible and objective.","Good scientists check their sources."]
],

{id:"endocrine",name:"Endocrine System & Homeostasis",short:"Hormones",c:"--t5",
reels:[
["Hormones = chemical messengers","Made by **endocrine glands** (no ducts), released straight into the **blood** and carried to **target organs**. Slower than nerves, but the effect lasts longer.","Endo = inside the body."],
["Who makes what?","**Hypothalamus**: ADH. **Pituitary**: TSH, FSH, LH, growth hormone. **Thyroid**: thyroxin. **Pancreas**: insulin and glucagon. **Adrenal**: adrenalin. **Gonads**: testosterone, oestrogen, progesterone. Also **oxytocin** and **prolactin**.","Learn each hormone with its gland."],
["Blood glucose loop","**High** glucose → pancreas releases **insulin** → liver turns glucose into glycogen and cells take it up → glucose falls. **Low** glucose → **glucagon** → liver breaks glycogen into glucose → glucose rises.","Insulin lowers. Glucagon raises.","loop"],
["Negative feedback","**Homeostasis** keeps the internal environment stable. A change is detected, a response **reverses** it and the system returns to its set point. Examples: blood glucose, and FSH/LH with oestrogen/progesterone.","Negative = reverses the change."],
["Adrenalin: fight or flight","The **adrenal glands** release **adrenalin** when you are scared or stressed. Heart rate and breathing go up, glucose is released and more blood goes to the muscles.","Adrenalin = action stations."],
["Thyroxin and growth hormone","**Thyroxin** controls metabolic rate; **TSH** from the pituitary tells the thyroid to make it. Too little causes hypothyroidism, a lack of iodine can cause goitre, too much is hyperthyroidism. **Growth hormone**: too little as a child gives dwarfism, too much gives gigantism.","Think: metabolism speed and body size."],
["ADH: water balance","The **hypothalamus** detects low water in the blood. ADH is released and makes the **kidneys** reabsorb more water, so urine is more concentrated.","ADH = Anti-Dry Hormone."],
["Diabetes","**Type 1**: the pancreas makes little or no insulin. **Type 2**: cells stop responding to insulin. Blood glucose stays too high. Managed with diet, exercise and insulin injections (made by engineered bacteria).","Link: diabetes + genetic engineering."]
],

{id:"humanrep",name:"Human Reproduction",short:"Human Repro",c:"--t6",
reels:[
["Male system tour","**Testes** (in the scrotum) make sperm in the **seminiferous tubules** (germinal epithelium, by meiosis) and make testosterone. **Epididymis** stores sperm, **sperm duct** carries it, **prostate gland** and **seminal vesicles** add fluid to form **semen**. The urethra runs through the **penis**.","Sperm is the cell. Semen is the fluid mix."],
["Sperm structure","**Head** with the nucleus and an **acrosome** (enzymes to enter the egg). **Middle piece** packed with **mitochondria** for energy. **Tail** for swimming. Erection = penis fills with blood. Ejaculation = semen is expelled.","Head, Middle, Tail: Info, Energy, Move."],
["Female system tour","**Ovaries** hold follicles, make eggs, oestrogen and progesterone. **Oviduct** carries the egg and is where **fertilisation** happens. **Uterus** has the **endometrium** (lining). **Cervix** is the opening. **Vagina** is the birth canal.","Egg path: ovary → oviduct → uterus."],
["The menstrual cycle","**FSH** grows a follicle which makes **oestrogen**, so the endometrium thickens. An oestrogen peak triggers an **LH surge** and **ovulation** (mid-cycle). The empty follicle becomes the **corpus luteum** and makes **progesterone**. No pregnancy: progesterone drops and **menstruation** starts.","FSH grows. LH launches. Progesterone protects.","cycle"],
["Feedback in the cycle","High **oestrogen and progesterone** inhibit **FSH and LH** (negative feedback). That is why no new follicle develops while progesterone is high during pregnancy.","Feedback links the endocrine and reproductive topics."],
["Fertilisation and implantation","Fertilisation happens in the **oviduct**. The **zygote** divides by **mitosis** into an **embryo**, which **implants** in the endometrium. Later it is called a **foetus**.","Zygote → embryo → foetus."],
["Life support: placenta and friends","The **placenta** lets oxygen and nutrients move to the foetus and wastes move out (the bloods do not mix), and makes hormones. The **umbilical cord** connects them. The **amnion** holds **amniotic fluid** that cushions the foetus.","Placenta = exchange."],
["Birth and milk","Hormone changes (including **oxytocin**) start contractions and birth. **Prolactin** makes the **mammary glands** produce milk, and oxytocin releases it.","Oxytocin pushes. Prolactin produces."],
["Contraception","**Condom**: barrier, also protects against STIs. **Diaphragm**: barrier over the cervix. **Pill** and **injection**: hormones stop ovulation. **IUD**: prevents implantation. **Rhythm method**: avoid sex near ovulation, least reliable.","Barrier, Hormone, Device, Timing."],
["Real-life links","Many partners raises the risk of **STIs** and **HIV**. Alcohol in pregnancy can cause **Foetal Alcohol Syndrome**. Debate topics: contraception and culture, infertility treatment, surrogacy, circumcision.","Biology meets ethics."]
],

reels:[
["Asexual vs sexual","**Asexual**: one parent, no gametes, offspring are identical clones, fast (runners, tubers, cuttings). **Sexual**: two gametes fuse, offspring vary, slower but more adaptable.","Clone = copy. Sexual = mix."],
["Parts of a flower","**Male**: stamen = **anther** (makes pollen grains with male gametes) on a **filament**. **Female**: **stigma** (catches pollen), **style**, **ovary** that holds **ovules** (each with an egg).","Stamen = male. Stigma = female."],
["Pollination vs fertilisation","**Pollination** = pollen moves from anther to stigma (wind or insects). **Fertilisation** = a male gamete fuses with the egg in the ovule. After this the **ovule becomes a seed** and the **ovary becomes a fruit**.","Pollination is the delivery. Fertilisation is the fusion."],
["Better crops","Crossing plants (sexual reproduction) makes new, improved varieties, including **polyploids** with bigger fruit. Asexual methods (cuttings, tissue culture) keep a good plant's traits. **Seed banks** protect biodiversity.","Sexual = new varieties. Asexual = keep the winner."],
["r-strategists vs K-strategists","**r**: many offspring, little care, mature fast, short life, e.g. sea turtle. **K**: few offspring, lots of care, long life, near carrying capacity, e.g. elephant, lion. Survivorship curves show when individuals die.","r = rapid. K = keep and care."],
["External vs internal fertilisation","**External** (fish, frogs): in water, lots of eggs, low survival of each. **Internal** (reptiles, birds, mammals): sperm placed inside the female, fewer eggs, better protection.","Internal = fewer but safer."],
["Oviparous, ovoviviparous, viviparous","**Oviparous**: eggs laid and develop outside (birds). **Ovoviviparous**: eggs develop inside the mother, nourished by yolk (some sharks and snakes). **Viviparous**: embryo grows inside, fed through a placenta (mammals).","Ovi = egg. Vivi = alive."],
["Egg shell, care and courtship","The **amniotic egg** has a shell and membranes that keep the embryo moist, so reptiles and birds can lay eggs on land. **Parental care** raises survival. **Courtship** helps animals find the right species and a good mate.","Protection raises survival."]

{id:"ecology",name:"Population & Community Ecology",short:"Ecology",c:"--t8",
reels:[
["From one animal to an ecosystem","**Individual** → **population** (one species, one place) → **community** (all the populations) → **ecosystem** (community + abiotic factors).","Zoom out one level at a time."],
["What changes a population?","Population size = **births + immigration − deaths − emigration**. It rises and falls with seasons and resource supply.","In = births, immigration. Out = deaths, emigration."],
["Limiting factors and carrying capacity","**Density-dependent** (competition, predation, disease) hit harder as numbers rise. **Density-independent** (fire, flood, drought) do not care. **Environmental resistance** slows growth until the population levels off at the **carrying capacity (K)**.","The S-curve flattens at K.","scurve"],
["Counting wild animals: mark-recapture","Catch **M** animals, mark them, release them. Later catch **C** animals; **R** of them are marked. **N = (M × C) ÷ R**. Precautions: marks must be harmless, animals must mix, no big births/deaths/migration in between.","Try it in the Pond Count game!"],
["Quadrats and census","**Quadrat**: count in random square samples, find the mean, then scale up to the whole area. **Census**: count every individual (only for small or easily seen populations). **Random sampling** avoids bias.","Quadrat = sample. Census = everyone."],
["Predator-prey cycles","Lion – zebra, aphid – ladybird, shark – fish. Prey numbers rise, then predators rise (with a delay), prey fall, then predators fall. This **regulates both populations**.","Predator peak lags behind prey peak."],
["Competition and niches","**Intraspecific**: same species. **Interspecific**: different species. A **niche** = the resources and conditions a species needs. Competition drives specialisation. **Resource partitioning** reduces it, e.g. forest trees using different heights, or lions and leopards hunting different prey.","Same niche = fight. Different niche = share."],
["Ecological succession","**Primary**: a new bare habitat (rock, lava). **Pioneers** such as lichens arrive first, then mosses, grasses, shrubs, trees. **Secondary**: a disturbed habitat with soil left (after fire). It is faster. There are many possible end points.","Pioneers pave the way.","succ"],
["Social organisation","**Herds/flocks** (zebra): many eyes spot predators. **Packs** (wild dogs): hunt together. **Dominant breeding pair** (wild dogs). **Castes** (termites): workers, soldiers, queen share the tasks.","Living together raises survival."],
["Human population","Exponential growth due to better medicine, sanitation and food, lowering death rates. Age-sex graphs with a **wide base** show rapid growth. Footprint per person is bigger in the developed world.","Think: births vs deaths vs footprint."]
],

{id:"evolution",name:"Evolution & Speciation",short:"Evolution",c:"--t9",
reels:[
["Lines of evidence","The theory of evolution is supported by the **fossil record**, **modification by descent**, **biogeography** and **genetics** (DNA similarities), as well as other evidence.","Many lines, one theory."],
["Who's who","**Erasmus Darwin** and **Lamarck** had early ideas (Lamarck: acquired characteristics are inherited, which is wrong). **Charles Darwin** and **Alfred Wallace** independently proposed **natural selection**.","Darwin and Wallace: the selection duo."],
["Natural selection in 5 steps","1) **Variation** exists. 2) More offspring are born than can survive. 3) **Struggle** for resources. 4) The **best adapted survive and reproduce**. 5) They pass on their **alleles**, so the population changes. Only **inherited** variation counts. Example: **peppered moth** in sooty Britain.","Vary, Compete, Survive, Reproduce, Repeat."],
["Artificial selection","Humans pick which organisms breed (dogs, cattle, maize). It **mimics natural selection**, but the selector is human, not the environment.","Same idea, different selector."],
["Where does variation come from?","**Mutations** (neutral, harmful or beneficial) and **genetic recombination** during meiosis and sexual reproduction. Mutations change genotype but may not show in the phenotype.","Mutation + recombination."],
["What is a species?","A group of organisms with common ancestry that closely resemble each other and can **interbreed to produce viable (fertile) offspring**.","Can they breed fertile babies? Same species."],
["Making new species","**Allopatric**: a barrier (mountain, river, continental drift) isolates populations, they face different selection pressures and eventually cannot interbreed. **Sympatric**: happens in the same area. Examples: **cichlids in Lake Malawi**, **Galapagos finches**.","Allo = other place. Sym = same place."],
["Reproductive isolation","Barriers that stop species interbreeding: **different breeding seasons**, **species-specific courtship**, and in plants **different pollinators**.","Different time, dance or pollinator."],
["Inbreeding, outbreeding, founder effect","**Inbreeding** raises homozygosity (more harmful recessives). **Outbreeding** promotes heterozygosity. **Founder effect**: a small group starts a new population with an unrepresentative gene pool, e.g. variegate porphyria in South Africans of Dutch descent.","Small start = skewed gene pool."],
["Convergence and divergence","**Divergence**: related species become different (Galapagos finches). **Convergence**: unrelated species become similar because of similar environments (shark and dolphin shape).","Converge = come together."],
["Pace of change","**Gradualism**: slow, steady change. **Punctuated equilibrium**: long stable periods broken by quick bursts. Cladograms show branching from common ancestors: closer branches mean closer relatives.","Read the branches: nearer = closer kin."],
["Evolution happening now","Bacteria can evolve **antibiotic resistance** quickly. Resistant TB (MDR and XDR) has spread because resistant bacteria survive treatment, reproduce and pass on the resistance allele.","Evolution is not only in the past."]
],

["Why does antibiotic resistance spread?","Resistant bacteria survive and reproduce",["Bacteria learn to resist","Antibiotics cause the mutation on purpose","Doctors choose resistant bacteria"],"Selection pressure favours the resistant ones."]
],

{id:"hominids",name:"Human Evolution",short:"Hominids",c:"--t10",
reels:[
["What is a hominid?","A bipedal animal in the fossil record with a mix of **ape-like and human-like features**. Hominid science uses **fossils**, **genetics** (especially **mitochondrial DNA**) and **archaeology**. Classification is still debated.","Hominid = walks upright."],
["From ape to human: the trends","Over time: **bigger brain** (cranial capacity), **smaller brow ridge**, **foramen magnum** moves under the skull, **smaller jaws and teeth**, flatter face, **bowl-shaped pelvis**, S-shaped spine, longer legs and shorter arms, arched feet.","Upright body, bigger brain, smaller jaw."],
["Lucy: Australopithecus afarensis","Found in the **Awash Valley, Ethiopia**. Walked upright but had a small brain and ape-like face. A very famous skeleton.","Lucy = Ethiopia."],
["Taung child and Mrs Ples","**A. africanus**. The **Taung child** was found by **Raymond Dart**. **Mrs Ples** was found at **Sterkfontein** in the **Cradle of Humankind**, South Africa.","Africanus = South Africa."],
["Newest South African finds","**Australopithecus sediba** may sit between Australopithecus and Homo. **Homo naledi** (Rising Star cave) is a possible candidate for the earliest Homo. New evidence keeps revising the story.","New fossils = new chapters."],
["Homo habilis: the handy man","The **first tool maker**. Found at **Lake Turkana (Kenya)** and **Olduvai Gorge (Tanzania)**. Bigger brain than the australopithecines.","Habilis = handy."],
["Homo erectus","Fully upright, larger brain, used fire and tools. Spread out of Africa. A disputed ancestor of modern humans and of **Homo neanderthalensis** (found in Europe).","Erectus walked out of Africa."],
["Homo sapiens in South Africa","Fossils at **Border Cave (KwaZulu-Natal)** and **Klasies River Mouth**. **Blombos** and **Pinnacle Point** caves show early use of fire to make **ochre artefacts**. The **San** are among the world's oldest living peoples.","Southern Africa has deep human history."],
["Everything is linked","**Bipedalism** freed the hands, which made **tool-making** easier, then **fire**, cooking, a bigger brain, **language** and **culture**. Each step supported the next.","They are interdependent."],
["Out of Africa vs Multiregional","**Out of Africa**: modern humans arose in Africa and spread, replacing other hominids. **Multiregional**: Homo erectus evolved into Homo sapiens in several regions independently. Genetic evidence supports African origins.","Where did sapiens start?"],
["We are cousins","All modern humans are genetically very closely related, and very similar to other primates (around 98% DNA similarity with chimpanzees).","Tiny differences, big stories.","brain"]
],

let feedTopic="mix";
function buildFeed(tp){
  const items=[];
  if(tp==="mix"){
    let pool=[];TOPICS.forEach(t=>shuffle(t.reels.map((r,i)=>({k:"reel",t:t.id,r,id:t.id+"-"+i}))).slice(0,2).forEach(x=>pool.push(x)));pool=shuffle(pool);
    const cks=shuffle(TOPICS.map(t=>({k:"check",t:t.id,q:pick(t.checks),id:t.id+"-mix"+Math.random()})));
    pool.forEach((x,i)=>{items.push(x);if(i%4===3&&cks.length)items.push(cks.pop())});
    items.push({k:"end",t:"mix"});
